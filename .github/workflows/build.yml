name: Build Lively Wallpaper

on:
  push:
    branches: [ "main", "core-separation" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore Dependencies
      run: dotnet restore src/Lively/Lively.sln

    - name: Build Lively Solution
      run: msbuild src/Lively/Lively.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Built App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lively-Wallpaper-Release-x64
        path: |
          src/Lively/Lively/bin/x64/Release/
          src/Lively/Lively.UI.WinUI/bin/x64/Release/
