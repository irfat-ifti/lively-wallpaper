name: Build Lively Wallpaper

on:
  push:
    branches: [ "main", "core-separation" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore Dependencies
      run: dotnet restore src/Lively/Lively.sln

    - name: Build Lively Solution
      run: msbuild src/Lively/Lively.sln /p:Configuration=Release /p:Platform=x64

    - name: Assemble Release Package
      shell: pwsh
      run: |
        $dist = "dist"
        New-Item -ItemType Directory -Force -Path "$dist\plugins\UI"
        New-Item -ItemType Directory -Force -Path "$dist\plugins\wmf"
        New-Item -ItemType Directory -Force -Path "$dist\plugins\cef"
        New-Item -ItemType Directory -Force -Path "$dist\plugins\webview2"
        New-Item -ItemType Directory -Force -Path "$dist\plugins\libvlc"

        # Download official package to extract MPV player and default wallpaper bundle
        $officialUrl = "https://github.com/lively-community/lively/releases/download/v2.2.1.0/lively_setup_x86_full_v2210.exe"
        $setupPath = "$env:TEMP\lively_official_setup.exe"
        Invoke-WebRequest -Uri $officialUrl -OutFile $setupPath
        $officialDir = "$env:TEMP\lively_official"
        Start-Process -FilePath $setupPath -ArgumentList "/DIR=`"$officialDir`" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
        
        # Copy Mpv player & Bundled Wallpapers
        if (Test-Path "$officialDir\plugins\Mpv") {
          Copy-Item -Path "$officialDir\plugins\Mpv" -Destination "$dist\plugins" -Recurse -Force
          Copy-Item -Path "$officialDir\plugins\Mpv" -Destination "$dist\plugins\mpv" -Recurse -Force
        }
        if (Test-Path "$officialDir\Bundle") {
          Copy-Item -Path "$officialDir\Bundle" -Destination "$dist" -Recurse -Force
        }

        # Core Lively files
        Copy-Item -Path "src/Lively/Lively/bin/x64/Release/net9.0-windows10.0.18362.0/*" -Destination "$dist" -Recurse -Force

        # WinUI UI
        Copy-Item -Path "src/Lively/Lively.UI.WinUI/bin/x64/Release/net9.0-windows10.0.22621.0/*" -Destination "$dist\plugins\UI" -Recurse -Force

        # Players
        if (Test-Path "src/Lively/Lively.Player.Wmf/bin/x64/Release") {
          Copy-Item -Path "src/Lively/Lively.Player.Wmf/bin/x64/Release/*" -Destination "$dist\plugins\wmf" -Recurse -Force
        }
        if (Test-Path "src/Lively/Lively.Player.CefSharp/bin/x64/Release") {
          Copy-Item -Path "src/Lively/Lively.Player.CefSharp/bin/x64/Release/*" -Destination "$dist\plugins\cef" -Recurse -Force
        }
        if (Test-Path "src/Lively/Lively.Player.WebView2/bin/x64/Release") {
          Copy-Item -Path "src/Lively/Lively.Player.WebView2/bin/x64/Release/*" -Destination "$dist\plugins\webview2" -Recurse -Force
        }
        if (Test-Path "src/Lively/Lively.Player.Vlc/bin/x64/Release") {
          Copy-Item -Path "src/Lively/Lively.Player.Vlc/bin/x64/Release/*" -Destination "$dist\plugins\libvlc" -Recurse -Force
        }

    - name: Upload Built App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lively-Wallpaper-Release-x64
        path: dist/
